name: Java CI avec Gradle

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Installer Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Donner les droits à Gradle
        run: chmod +x gradlew

      - name: Build avec Gradle
        run: ./gradlew build
